name: Claude で投稿文を自動生成

on:
  schedule:
    # 毎週日曜 日本時間 10:00（UTC 01:00）に生成してキューに追加
    - cron: "0 1 * * 0"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージインストール
        run: pip install anthropic

      - name: 投稿文を生成してキューに追加
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_post.py

      - name: queue.json をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sns/queue.json
          git diff --staged --quiet || git commit -m "chore: 自動生成ツイートをキューに追加"
          git push
